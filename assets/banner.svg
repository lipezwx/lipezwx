<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Luiz Felipe S. Fernando — Python, data and automation developer. Featured: Synvox, RainingMD, CacaoX." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0d"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="10%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f3"/>
      <stop offset="1" stop-color="#f2f2f3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <clipPath id="mdclip"><rect x="24" y="20" width="118" height="110" rx="6"/></clipPath>
    <clipPath id="docclip"><rect x="40" y="18" width="86" height="112" rx="4"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- name block -->
  <g font-family="'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif">
    <text x="64" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="7" fill="#8d8d92">PORTFOLIO — 2026</text>
    <text x="62" y="152" font-size="54" font-weight="400" fill="#e9e9eb" letter-spacing="1">Luiz Felipe</text>
    <text x="60" y="228" font-size="78" font-style="italic" font-weight="700" fill="#ffffff">S. Fernando</text>
    <rect x="64" y="248" width="260" height="1.5" fill="url(#rule)"/>
    <text x="64" y="284" font-size="19" font-style="italic" fill="#9a9a9f" letter-spacing=".5">Python  ·  Data  ·  Automation  ·  AI-ready tools</text>
  </g>

  <!-- ============ card 1: Synvox ============ -->
  <g transform="translate(596,60)">
    <rect width="166" height="200" rx="10" fill="#141415" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="40" y="18" width="86" height="112" rx="4" fill="#1c1c1e" stroke="#d6d6d9" stroke-opacity=".8"/>
    <g stroke="#cfcfd3" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
      <line x1="50" y1="34" x2="92" y2="34"/>
      <line x1="50" y1="46" x2="116" y2="46"/>
      <line x1="50" y1="58" x2="104" y2="58"/>
      <line x1="50" y1="70" x2="112" y2="70"/>
    </g>
    <rect x="48" y="82" width="70" height="16" rx="2" fill="none" stroke="#d6d6d9" stroke-opacity=".5" stroke-dasharray="2 2"/>
    <text x="52" y="93" font-family="'Consolas','Courier New',monospace" font-size="6.5" fill="#d6d6d9" fill-opacity=".85">3519 0812 4455 …</text>
    <g clip-path="url(#docclip)">
      <rect x="40" y="18" width="86" height="14" fill="url(#scan)">
        <animate attributeName="y" values="14;118;14" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="118" cy="124" r="9" fill="#f2f2f3"/>
    <path d="M113.5 124.2 l3.2 3.2 l6 -6.4" fill="none" stroke="#141415" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="83" y="170" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#f2f2f3">SYNVOX</text>
    <text x="83" y="187" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-style="italic" fill="#8d8d92">Invoice extractor</text>
  </g>

  <!-- ============ card 2: RainingMD ============ -->
  <g transform="translate(780,60)">
    <rect width="166" height="200" rx="10" fill="#141415" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="24" y="20" width="118" height="110" rx="6" fill="#1c1c1e" stroke="#d6d6d9" stroke-opacity=".8"/>
    <circle cx="35" cy="30" r="2.5" fill="#d6d6d9" fill-opacity=".5"/>
    <circle cx="44" cy="30" r="2.5" fill="#d6d6d9" fill-opacity=".5"/>
    <circle cx="53" cy="30" r="2.5" fill="#d6d6d9" fill-opacity=".5"/>
    <line x1="24" y1="40" x2="142" y2="40" stroke="#ffffff" stroke-opacity=".12"/>
    <g font-family="'Consolas','Courier New',monospace">
