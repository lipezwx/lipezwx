      <text x="36" y="84" font-size="9" fill="#a8a8ad">**calm** writing,</text>
      <text x="36" y="98" font-size="9" fill="#a8a8ad">_split_ preview</text>
      <text x="36" y="112" font-size="9" fill="#a8a8ad">- focus mode</text>
    </g>
    <g clip-path="url(#mdclip)" stroke="#ffffff" stroke-linecap="round" stroke-width="1.4" stroke-opacity=".5">
      <g>
        <line x1="50" y1="0" x2="46" y2="9"/><line x1="82" y1="-20" x2="78" y2="-11"/><line x1="112" y1="-8" x2="108" y2="1"/><line x1="132" y1="-30" x2="128" y2="-21"/><line x1="66" y1="-40" x2="62" y2="-31"/><line x1="98" y1="-55" x2="94" y2="-46"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 130" dur="1.9s" repeatCount="indefinite"/>
      </g>
      <g>
        <line x1="40" y1="-60" x2="36" y2="-51"/><line x1="90" y1="-75" x2="86" y2="-66"/><line x1="122" y1="-65" x2="118" y2="-56"/><line x1="58" y1="-90" x2="54" y2="-81"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 130" dur="1.9s" begin="-0.95s" repeatCount="indefinite"/>
      </g>
    </g>
    <text x="83" y="170" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#f2f2f3">RAININGMD</text>
    <text x="83" y="187" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-style="italic" fill="#8d8d92">Markdown editor</text>
  </g>

  <!-- ============ card 3: CacaoX ============ -->
  <g transform="translate(964,60)">
    <rect width="166" height="200" rx="10" fill="#141415" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="18" y="20" width="130" height="110" rx="6" fill="#1c1c1e" stroke="#d6d6d9" stroke-opacity=".8"/>
    <g stroke="#ffffff" stroke-opacity=".08">
      <line x1="26" y1="50" x2="140" y2="50"/><line x1="26" y1="72" x2="140" y2="72"/><line x1="26" y1="94" x2="140" y2="94"/>
    </g>
    <line x1="26" y1="116" x2="140" y2="116" stroke="#d6d6d9" stroke-opacity=".7"/>
    <g fill="#e6e6e8">
      <rect x="32" y="92" width="12" height="24" fill-opacity=".35"/>
      <rect x="49" y="76" width="12" height="40" fill-opacity=".5"/>
      <rect x="66" y="84" width="12" height="32" fill-opacity=".4"/>
      <rect x="83" y="62" width="12" height="54" fill-opacity=".65"/>
      <rect x="100" y="72" width="12" height="44" fill-opacity=".5"/>
      <rect x="117" y="48" width="12" height="68" fill-opacity=".85"/>
    </g>
    <polyline points="38,84 55,68 72,76 89,54 106,62 123,40" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;.45;.85;1" dur="4.5s" repeatCount="indefinite"/>
    </polyline>
    <g fill="#ffffff">
      <circle cx="38" cy="84" r="2"/><circle cx="55" cy="68" r="2"/><circle cx="72" cy="76" r="2"/><circle cx="89" cy="54" r="2"/><circle cx="106" cy="62" r="2"/><circle cx="123" cy="40" r="2.6"/>
    </g>
    <text x="83" y="170" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#f2f2f3">CACAOX</text>
    <text x="83" y="187" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-style="italic" fill="#8d8d92">Inventory dashboard</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
